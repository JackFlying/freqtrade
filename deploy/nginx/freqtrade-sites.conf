server {
    server_name freqtrade.quantstation.duckdns.org;

    location ^~ /api/v1/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # FreqUI's multi-bot manager uses this API-only route for strategy2.
    # The strategy2 service remains private on 127.0.0.1:8082.
    location ^~ /strategy2/api/v1/ {
        auth_basic off;
        rewrite ^/strategy2(/api/v1/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location / {
        # Freqtrade UI uses the API server login. Do not add Nginx Basic Auth
        # here, otherwise browser Basic credentials compete with Bearer tokens.
        add_header Set-Cookie "ft_auth=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax" always;

        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    ssl_certificate /etc/letsencrypt/live/freqtrade.quantstation.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freqtrade.quantstation.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name console.quantstation.duckdns.org;

    # Dashboard has its own JWT login. Keep Nginx Basic Auth off here to avoid
    # competing Authorization headers and duplicate login prompts.
    location / {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/freqtrade.quantstation.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/freqtrade.quantstation.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name freqtrade.quantstation.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name console.quantstation.duckdns.org;
    return 301 https://$host$request_uri;
}
